<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; }
    a { color:#13215E; }
    a:hover { color:#0A1440; }
    ::placeholder { color:#A3A3A3; }
    input { font-family:'Inter','Anuphan',sans-serif; }
  </style>
</helmet>
<div style="display:flex;height:100vh;background:#FFFFFF;font-family:'Inter','Anuphan',sans-serif;color:#252525;overflow:hidden">
  <!-- SIDEBAR — mirrors app/(main)/_components/sidebar -->
  <div style="width:256px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid #EBEBEB;background:#FFFFFF;overflow:hidden">
    <div style="height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #EBEBEB">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#2C4090 0%,#13215E 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(19,33,94,0.3)">{{ logoIcon }}</div>
        <span style="font-size:18px;font-weight:700;letter-spacing:-0.01em;color:#252525">OIT Service</span>
      </div>
      <div style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8E8E8E">{{ panelIcon }}</div>
    </div>
    <div style="flex:1;overflow-y:auto">
      <div style="padding:16px 12px">
        <div style="display:flex;flex-direction:column;gap:8px">{{ sidebarNav }}</div>
        <div style="margin-top:24px;border-top:1px solid #EBEBEB;padding-top:16px">{{ sidebarBottom }}</div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden">
    <!-- HEADER — mirrors app/(main)/_components/header -->
    <div style="height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #EBEBEB;background:rgba(255,255,255,0.8);backdrop-filter:blur(12px);padding:0 24px">
      <div style="display:flex;align-items:center;gap:16px">
        <h1 style="font-size:18px;font-weight:600;color:#252525;margin:0">{{ pageTitle }}</h1>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="padding:8px;border-radius:8px;color:#737373;cursor:pointer;display:flex">{{ moonIcon }}</div>
        <div style="display:flex;align-items:center;gap:10px;border-radius:999px;padding:6px 6px 6px 12px;cursor:pointer">
          <span style="font-size:14px;font-weight:500;color:#404040">สมชาย ธนกร</span>
          <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2C4090 0%,#13215E 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #EEF1FA">
            <span style="font-size:12px;font-weight:700;color:#fff">สธ</span>
          </div>
          {{ chevronDownIcon }}
        </div>
      </div>
    </div>

    <!-- PAGE CONTENT — main p-6 -->
    <div style="flex:1;overflow-y:auto;padding:24px">
      {{ pageContent }}
    </div>
  </div>
</div>

</x-dc>

          h('div',{key:'c',style:{height:130,borderRadius:8,background:'#FAFAFA',border:'1px solid #F0F0F0',display:'flex',alignItems:'center',justifyContent:'center',color:C.muted,fontSize:13,marginTop:16}},'[ ปฏิทินวันหยุดราชการ ]')])]));
    } else if (tab==='catalog') {
      body = h('div',{},
        secHead('package','Service Catalog','หมวดหมู่บริการและผู้รับผิดชอบเริ่มต้น'),
        this.card([
          h('div',{key:'ch',style:{padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}},
            h('div',{style:{display:'grid',gap:4}},
              h('div',{style:{fontSize:16,fontWeight:500,color:C.fg}},'หมวดหมู่บริการ'),

            h('div',{key:'a',style:{display:'flex',gap:16,flexWrap:'wrap',marginBottom:16}},

          {key:i})))

  pageMap(){
    return {dashboard:'pageDashboard', tickets:'pageTickets', 'ticket-detail':'pageTicketDetail', 'new-ticket':'pageNewTicket',
      'my-work':'pageMyWork', kanban:'pageKanban', kb:'pageKB', assets:'pageAssets', approvals:'pageApprovals',
      reports:'pageReports', admin:'pageAdmin', help:'pageHelp'};
  }
  currentTitle(){
    const all = this.NAV.reduce((acc,s)=>acc.concat(s.items),[]).concat(this.BOTTOM);
    if (this.state.page==='ticket-detail') return 'รายละเอียด Ticket';
    const found = all.find(i=>i.k===this.state.page);
    return found ? found.l : 'แดชบอร์ด';
  }

  renderVals(){
    const fn = this.pageMap()[this.state.page] || 'pageDashboard';
    return {
      logoIcon: this.ic('sparkles',16,'#fff',2),
      panelIcon: this.ic('panelLeft',16,'#8E8E8E',2),
      moonIcon: this.ic('moon',20,'#737373',2),
      chevronDownIcon: this.ic('chevronDown',16,'#A3A3A3',2),
      sidebarNav: this.renderSidebar(),
      sidebarBottom: this.BOTTOM.map(it=>this.navItem(it)),
      pageTitle: this.currentTitle(),
      pageContent: this[fn](),
    };
  }
}
